services:
  postgres:
    image: postgres:16
    container_name: adflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adflow}
      POSTGRES_USER: ${POSTGRES_USER:-adflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adflow1234}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adflow} -d ${POSTGRES_DB:-adflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
